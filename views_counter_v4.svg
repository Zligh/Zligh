<svg viewBox="0 0 120 35" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pulsing dot -->
  <circle cx="15" cy="17.5" r="3" fill="#ff6a00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- VIEWS label -->
  <text x="28" y="22" font-family="SFMono-Regular, ui-monospace, monospace" font-size="12" fill="#d0d0d5" letter-spacing="0.5px">VIEWS</text>

  <!-- View count from komarev -->
  <text id="viewCount" x="100" y="22" text-anchor="end" font-family="SFMono-Regular, ui-monospace, monospace" font-size="12" fill="#ff6a00" font-weight="bold" filter="url(#glow)">0</text>

  <!-- Komarev tracking pixel -->
  <image href="https://komarev.com/ghpvc/?username=Zligh&amp;json=true" width="0" height="0" opacity="0"/>
</svg>