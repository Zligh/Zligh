name: Update Views Counter
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-counter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Get views count
        id: views
        run: |
          VIEWS=$(curl -s "https://api.github.com/repos/Zligh/Zligh" | jq '.watchers')
          echo "views=$VIEWS" >> $GITHUB_OUTPUT
      
      - name: Update SVG
        run: |
          cat > views_counter.svg << 'EOF'
          <svg width="300" height="60" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#ff6a00;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
              </linearGradient>
              <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
              </filter>
            </defs>
            
            <!-- Background card -->
            <rect x="10" y="10" width="280" height="40" rx="8" fill="#1a1a1a" filter="url(#shadow)" stroke="url(#grad1)" stroke-width="1.5"/>
            
            <!-- Eye icon -->
            <circle cx="35" cy="30" r="3" fill="#ff6a00"/>
            <ellipse cx="35" cy="30" rx="8" ry="6" fill="none" stroke="#ff6a00" stroke-width="1.5"/>
            
            <!-- Text -->
            <text x="55" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Profile Views</text>
            <text x="240" y="38" text-anchor="end" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="url(#grad1)">${{ steps.views.outputs.views }}</text>
          </svg>
          EOF
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add views_counter.svg
          git commit -m "Update views counter" || echo "No changes to commit"
          git push
