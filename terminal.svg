<svg viewBox="0 0 1100 550" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080706"/>
      <stop offset="100%" stop-color="#11100f"/>
    </linearGradient>

    <!-- Window -->
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121110"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>

    <!-- Warm Glow -->
    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ambient -->
    <radialGradient id="ambient">
      <stop offset="0%"
            stop-color="#d7b58d"
            stop-opacity="0.12"/>

      <stop offset="100%"
            stop-color="#d7b58d"
            stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Background -->
  <rect width="1100"
        height="550"
        fill="url(#bg)"/>

  <!-- Ambient Glow -->
  <ellipse cx="550"
           cy="275"
           rx="380"
           ry="180"
           fill="url(#ambient)">

    <animate
      attributeName="opacity"
      values="0.5;1;0.5"
      dur="8s"
      repeatCount="indefinite"/>
  </ellipse>

  <!-- Terminal Window -->
  <rect x="70"
        y="50"
        width="960"
        height="450"
        rx="28"
        fill="url(#window)"
        stroke="#8f7458"
        stroke-width="2.5"
        filter="url(#glow)">

    <animate
      attributeName="stroke-opacity"
      values="0.55;0.9;0.55"
      dur="7s"
      repeatCount="indefinite"/>

  </rect>

  <!-- Title Bar -->
  <rect x="70"
        y="50"
        width="960"
        height="58"
        rx="28"
        fill="#161514"/>

  <!-- Separator -->
  <line x1="70"
        y1="108"
        x2="1030"
        y2="108"
        stroke="#2a2521"/>

  <!-- macOS Buttons -->
  <circle cx="105"
          cy="79"
          r="11"
          fill="#ff5f57"/>

  <circle cx="145"
          cy="79"
          r="11"
          fill="#ffbd2e"/>

  <circle cx="185"
          cy="79"
          r="11"
          fill="#28c840"/>

  <!-- Title -->
  <text x="550"
        y="87"
        text-anchor="middle"
        fill="#cfb18d"
        opacity="0.85"
        font-size="24"
        font-family="JetBrains Mono, Consolas, monospace">

    zligh@rust:~

  </text>

  <!-- Prompt -->
  <text x="145"
        y="275"
        fill="#c9aa84"
        font-size="34"
        font-family="JetBrains Mono, Consolas, monospace">

    zligh@rust:~$

  </text>

  <!-- Main Text -->
  <text x="145"
        y="355"
        fill="#ecd1ab"
        font-size="62"
        font-weight="500"
        font-family="JetBrains Mono, Consolas, monospace"
        filter="url(#glow)">

    Just Use Rust. Brutal

    <animate
      attributeName="opacity"
      values="0.97;1;0.98;1;0.97"
      dur="5s"
      repeatCount="indefinite"/>

  </text>

  <!-- Cursor -->
  <rect x="875"
        y="305"
        width="16"
        height="66"
        fill="#f2dcc0">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>

  </rect>

  <!-- Bottom subtle text -->
  <text x="145"
        y="450"
        fill="#6f6255"
        font-size="20"
        font-family="JetBrains Mono, Consolas, monospace">

    Rust • Assembly • Reverse Engineering

  </text>

</svg>
