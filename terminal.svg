<svg viewBox="0 0 800 400" xmlns="http://w3.org">
  <defs>
    <!-- Плавне та м'яке розмиття для заднього фону -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
    </filter>

    <!-- Градієнт для глибокого темного фону -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0e11;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050506;stop-opacity:1" />
    </linearGradient>

    <!-- Елегантний градієнт для рамки "матового скла" -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.02" />
    </linearGradient>

    <!-- М'які монохромні градієнти для фонових хвиль -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1d24;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#0d0e11;stop-opacity:0" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#252730;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#050506;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Головний темний фон -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  
  <!-- Скандинавські плавні фонові пейзажні хвилі (імітація гір) -->
  <g opacity="0.7">
    <!-- Задня хвиля з повільним рухом вбік -->
    <path d="M 0 280 Q 200 220 400 270 T 800 240 L 800 400 L 0 400 Z" fill="url(#waveGrad1)">
      <animate attributeName="d" 
               values="M 0 280 Q 200 220 400 270 T 800 240 L 800 400 L 0 400 Z;
                       M 0 270 Q 250 240 450 250 T 800 260 L 800 400 L 0 400 Z;
                       M 0 280 Q 200 220 400 270 T 800 240 L 800 400 L 0 400 Z" 
               dur="15s" repeatCount="indefinite"/>
    </path>

    <!-- Передня хвиля, що рухається у протилежний бік -->
    <path d="M 0 310 Q 250 260 500 320 T 800 290 L 800 400 L 0 400 Z" fill="url(#waveGrad2)">
      <animate attributeName="d" 
               values="M 0 310 Q 250 260 500 320 T 800 290 L 800 400 L 0 400 Z;
                       M 0 320 Q 200 290 480 300 T 800 310 L 800 400 L 0 400 Z;
                       M 0 310 Q 250 260 500 320 T 800 290 L 800 400 L 0 400 Z" 
               dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Контейнер у стилі мінімалістичного вікна терміналу -->
  <g>
    <!-- Основна підкладка з ледь помітним розмиттям та благородною світлою рамкою -->
    <rect x="60" y="60" width="680" height="280" rx="16" fill="#111216" fill-opacity="0.5" stroke="url(#borderGrad)" stroke-width="1.5" />
    
    <!-- Кнопки керування у стилі macOS, але приглушені (монохромні), щоб не привертати зайвої уваги -->
    <circle cx="95" cy="90" r="5.5" fill="#ffffff" opacity="0.2"/>
    <circle cx="115" cy="90" r="5.5" fill="#ffffff" opacity="0.15"/>
    <circle cx="135" cy="90" r="5.5" fill="#ffffff" opacity="0.1"/>
    
    <!-- Назва терміналу / Шлях користувача -->
    <text x="165" y="94" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="500" fill="#ffffff" opacity="0.35">
      zligh@rust:~$
    </text>

    <!-- Головний текст: Чистий, великий, з дуже м'якою анімацією «дихання» (зміни прозорості) -->
    <text x="400" y="205" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
      Just Use Rust. Brutal
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4.5s" repeatCount="indefinite"/>
    </text>

    <!-- Декоративний нижній роздільник із м'яким згасанням до країв -->
    <line x1="250" y1="240" x2="550" y2="240" stroke="#ffffff" stroke-width="1" opacity="0.08">
      <animate attributeName="opacity" values="0.05;0.12;0.05" dur="6s" repeatCount="indefinite"/>
    </line>
    
    <!-- Нижня інформаційна панель -->
    <text x="400" y="275" font-family="Courier New, Courier, monospace" font-size="13" fill="#ffffff" text-anchor="middle" opacity="0.25" letter-spacing="1">
      ~/projects/rust
    </text>
  </g>
</svg>
