<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon glow filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050508;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="neonRadial1" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ff8800;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff6600;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="neonRadial2" cx="70%" cy="60%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff4400;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <rect width="800" height="400" fill="#0a0a0f"/>
  
  <!-- Ambient neon glow -->
  <rect x="50" y="60" width="700" height="280" fill="url(#neonRadial1)" opacity="0.6"/>
  <rect x="50" y="60" width="700" height="280" fill="url(#neonRadial2)" opacity="0.5"/>

  <!-- macOS Window Frame -->
  <g>
    <!-- Window body with pulsing border -->
    <rect x="50" y="60" width="700" height="280" rx="20" fill="url(#windowGrad)" stroke="#ff8800" stroke-width="2.5" filter="url(#neonGlow)">
      <animate attributeName="stroke-width" values="2.5;3;2.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#ff8800;#ffaa00;#ff8800" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- macOS Traffic Light Buttons -->
    <circle cx="80" cy="85" r="6" fill="#ff5f57"/>
    <circle cx="105" cy="85" r="6" fill="#ffbd2e"/>
    <circle cx="130" cy="85" r="6" fill="#28c940"/>
    
    <!-- Window title bar -->
    <rect x="50" y="60" width="700" height="40" rx="20" fill="rgba(20, 20, 40, 0.8)" stroke="#ff8800" stroke-width="2.5"/>
    <text x="400" y="87" font-family="Monaco, monospace" font-size="13" fill="#ff8800" text-anchor="middle" opacity="0.8">
      <tspan>zligh@rust:~$</tspan>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </text>

    <!-- Animated Liquid flowing elements -->
    <!-- Liquid 1 - Left side -->
    <circle cx="150" cy="180" r="50" fill="#ff8800" opacity="0.15" filter="url(#strongGlow)">
      <animate attributeName="cx" values="150;160;145;155;150" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;170;185;175;180" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="50;55;50;55;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.25;0.15;0.25;0.15" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Liquid 2 - Right side -->
    <circle cx="650" cy="160" r="60" fill="#ff6600" opacity="0.12" filter="url(#strongGlow)">
      <animate attributeName="cx" values="650;640;660;645;650" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;150;170;155;160" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="60;65;60;65;60" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.22;0.12;0.22;0.12" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Liquid 3 - Center bottom -->
    <circle cx="400" cy="250" r="45" fill="#ff7700" opacity="0.1" filter="url(#strongGlow)">
      <animate attributeName="cx" values="400;410;390;405;400" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;240;260;245;250" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="45;50;45;50;45" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.2;0.1;0.2;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Shine overlay -->
    <ellipse cx="200" cy="150" rx="80" ry="60" fill="white">
      <animate attributeName="opacity" values="0;0.15;0;0.15;0" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Main neon text with flicker -->
    <text x="400" y="200" font-family="Monaco, monospace" font-size="48" font-weight="bold" fill="#ff8800" text-anchor="middle" filter="url(#strongGlow)" letter-spacing="2">Just Use Rust. Brutal
      <animate attributeName="opacity" values="1;0.95;1;0.97;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ff8800;#ffaa00;#ff8800;#ff9900;#ff8800" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- Decorative neon line with pulse -->
    <line x1="100" y1="230" x2="700" y2="230" stroke="#ff6600" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#ff6600;#ff8800;#ff6600" dur="2.5s" repeatCount="indefinite"/>
    </line>
    
    <!-- Bottom status bar -->
    <rect x="50" y="310" width="700" height="30" fill="rgba(20, 20, 40, 0.5)" stroke="#ff8800" stroke-width="2.5" stroke-opacity="0.5"/>
    <text x="70" y="330" font-family="Monaco, monospace" font-size="11" fill="#ff8800" opacity="0.6">~/projects/rust</text>
  </g>
</svg>
