<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://w3.org">
  <defs>
    <!-- Глубокий темный фон -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D0E11"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>

    <!-- Мягкое туманное свечение (замена фильтрам) -->
    <radialGradient id="glowLeft" cx="150" cy="360" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1B23" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0D0E11" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="650" cy="380" r="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14151A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>

    <!-- Полупрозрачная рамка окна -->
    <linearGradient id="border" x1="60" y1="60" x2="740" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Базовый фон -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Мягкие фоновые холмы из референса -->
  <circle cx="150" cy="360" r="300" fill="url(#glowLeft)"/>
  <circle cx="650" cy="380" r="350" fill="url(#glowRight)"/>

  <!-- Окно интерфейса -->
  <rect x="60" y="60" width="680" height="280" rx="14" fill="#0D0E12" fill-opacity="0.4"/>
  <rect x="60" y="60" width="680" height="280" rx="14" stroke="url(#border)" stroke-width="1.2"/>

  <!-- Иконки управления -->
  <circle cx="95" cy="90" r="5" fill="#FFFFFF" fill-opacity="0.15"/>
  <circle cx="115" cy="90" r="5" fill="#FFFFFF" fill-opacity="0.1"/>
  <circle cx="135" cy="90" r="5" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- Путь в терминале -->
  <text x="165" y="95" fill="#FFFFFF" fill-opacity="0.3" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="500">zligh:~/rust</text>

  <!-- Главный текст -->
  <text x="400" y="205" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5">Just Use Rust. Brutal</text>

  <!-- Разделитель -->
  <line x1="280" y1="245" x2="520" y2="245" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Нижний статус -->
  <text x="400" y="278" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.2" font-family="Consolas, Monaco, monospace" font-size="12" letter-spacing="1">src/main.rs</text>
</svg>
