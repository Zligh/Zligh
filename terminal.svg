<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon glow filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050508;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="neonRadial1" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ff8800;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff6600;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="neonRadial2" cx="70%" cy="60%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff4400;stop-opacity:0" />
    </radialGradient>

    <!-- Animations -->
    <style>
      @keyframes neonFlicker {
        0%, 100% {
          opacity: 1;
          filter: drop-shadow(0 0 10px #ff8800) drop-shadow(0 0 20px #ff6600);
        }
        25% {
          opacity: 0.95;
          filter: drop-shadow(0 0 8px #ff8800) drop-shadow(0 0 15px #ff6600);
        }
        50% {
          opacity: 1;
          filter: drop-shadow(0 0 12px #ff8800) drop-shadow(0 0 25px #ff6600);
        }
        75% {
          opacity: 0.97;
          filter: drop-shadow(0 0 9px #ff8800) drop-shadow(0 0 18px #ff6600);
        }
      }

      @keyframes neonPulse {
        0%, 100% {
          stroke-width: 2.5;
          filter: drop-shadow(0 0 8px #ff8800) drop-shadow(0 0 15px #ff6600);
        }
        50% {
          stroke-width: 3;
          filter: drop-shadow(0 0 15px #ff8800) drop-shadow(0 0 25px #ff6600);
        }
      }

      @keyframes liquidFlow {
        0%, 100% {
          opacity: 0.2;
          r: 45px;
        }
        50% {
          opacity: 0.35;
          r: 55px;
        }
      }

      @keyframes liquidFloat1 {
        0%, 100% {
          cx: 150px;
          cy: 180px;
        }
        25% {
          cx: 160px;
          cy: 170px;
        }
        50% {
          cx: 145px;
          cy: 185px;
        }
        75% {
          cx: 155px;
          cy: 175px;
        }
      }

      @keyframes liquidFloat2 {
        0%, 100% {
          cx: 650px;
          cy: 160px;
        }
        25% {
          cx: 640px;
          cy: 150px;
        }
        50% {
          cx: 660px;
          cy: 170px;
        }
        75% {
          cx: 645px;
          cy: 155px;
        }
      }

      @keyframes liquidFloat3 {
        0%, 100% {
          cx: 400px;
          cy: 250px;
        }
        25% {
          cx: 410px;
          cy: 240px;
        }
        50% {
          cx: 390px;
          cy: 260px;
        }
        75% {
          cx: 405px;
          cy: 245px;
        }
      }

      @keyframes shine {
        0%, 100% {
          opacity: 0;
        }
        50% {
          opacity: 0.15;
        }
      }

      .neon-text {
        animation: neonFlicker 4s ease-in-out infinite;
      }

      .neon-border {
        animation: neonPulse 3s ease-in-out infinite;
      }

      .liquid-1 {
        animation: liquidFlow 4s ease-in-out infinite, liquidFloat1 6s ease-in-out infinite;
      }

      .liquid-2 {
        animation: liquidFlow 4.5s ease-in-out infinite, liquidFloat2 7s ease-in-out infinite;
      }

      .liquid-3 {
        animation: liquidFlow 5s ease-in-out infinite, liquidFloat3 8s ease-in-out infinite;
      }

      .shine-effect {
        animation: shine 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background glow -->
  <rect width="800" height="400" fill="#0a0a0f"/>
  
  <!-- Ambient neon glow -->
  <rect x="50" y="60" width="700" height="280" fill="url(#neonRadial1)" opacity="0.6"/>
  <rect x="50" y="60" width="700" height="280" fill="url(#neonRadial2)" opacity="0.5"/>

  <!-- macOS Window Frame -->
  <g>
    <!-- Window body -->
    <rect x="50" y="60" width="700" height="280" rx="20" fill="url(#windowGrad)" stroke="#ff8800" stroke-width="2.5" class="neon-border"/>
    
    <!-- macOS Traffic Light Buttons -->
    <circle cx="80" cy="85" r="6" fill="#ff5f57"/>
    <circle cx="105" cy="85" r="6" fill="#ffbd2e"/>
    <circle cx="130" cy="85" r="6" fill="#28c940"/>
    
    <!-- Window title bar -->
    <rect x="50" y="60" width="700" height="40" rx="20" fill="rgba(20, 20, 40, 0.8)" stroke="#ff8800" stroke-width="2.5"/>
    <text x="400" y="87" font-family="Monaco, monospace" font-size="13" fill="#ff8800" text-anchor="middle" opacity="0.8">zligh@rust:~$</text>

    <!-- Liquid flowing elements (watery/neon effect) -->
    <circle class="liquid-1" cx="150" cy="180" r="50" fill="#ff8800" opacity="0.15" filter="url(#strongGlow)"/>
    <circle class="liquid-2" cx="650" cy="160" r="60" fill="#ff6600" opacity="0.12" filter="url(#strongGlow)"/>
    <circle class="liquid-3" cx="400" cy="250" r="45" fill="#ff7700" opacity="0.1" filter="url(#strongGlow)"/>

    <!-- Shine overlay -->
    <ellipse cx="200" cy="150" rx="80" ry="60" fill="white" class="shine-effect"/>

    <!-- Main neon text -->
    <text class="neon-text" x="400" y="200" font-family="Monaco, monospace" font-size="48" font-weight="bold" fill="#ff8800" text-anchor="middle" filter="url(#strongGlow)" letter-spacing="2">Just Use Rust. Brutal</text>

    <!-- Decorative neon lines -->
    <line x1="100" y1="230" x2="700" y2="230" stroke="#ff6600" stroke-width="1.5" opacity="0.3" class="neon-text"/>
    
    <!-- Bottom status bar -->
    <rect x="50" y="310" width="700" height="30" fill="rgba(20, 20, 40, 0.5)" stroke="#ff8800" stroke-width="2.5" stroke-opacity="0.5"/>
    <text x="70" y="330" font-family="Monaco, monospace" font-size="11" fill="#ff8800" opacity="0.6">~/projects/rust</text>
  </g>
</svg>