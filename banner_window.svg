<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" style="background-color:#030305; overflow:hidden;">
  <defs>
    <filter id="macos-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="40" stdDeviation="50" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="button-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cursor-shadow" x="-250%" y="-250%" width="600%" height="600%">
      <feDropShadow dx="-24" dy="48" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="rust-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="dimBlur">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="dimBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="window-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0.97"/>
    </linearGradient>

    <linearGradient id="titlebar-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#202025" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#151518" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#101016" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#161622" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#07070a" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="wave-grad-3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030304" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0c0c12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020203" stop-opacity="0.85"/>
    </linearGradient>

    <style>
      .monospace-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 36px;
        letter-spacing: 0.4px;
        font-weight: 450;
        fill: #e4e4e9;
      }
      .title-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.5px;
        fill: #85858b;
      }
      
      /* Smooth, single-axis drift for the window panel */
      @keyframes windowFloatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      
      /* Perfect multi-axis fluid loops with zero clipping boundaries */
      @keyframes cursorFloatX {
        0%, 100% { transform: translateX(-25px); }
        50% { transform: translateX(25px); }
      }
      @keyframes cursorFloatY {
        0%, 100% { transform: translateY(15px); }
        50% { transform: translateY(-15px); }
      }

      @keyframes cursorFade {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .blinking-cursor {
        animation: cursorFade 1.3s ease-in-out infinite;
      }

      @keyframes waveFloatBack {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-100px, 35px) scale(1.04); }
      }
      @keyframes waveFloatMid {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(120px, -45px) scale(1.03); }
      }
      @keyframes waveFloatFront {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-70px, -60px) scale(1.05); }
      }
    </style>
  </defs>

  <g style="animation: waveFloatBack 28s ease-in-out infinite; transform-origin: 35% 55%;">
    <path d="M -400 370 C 200 220, 500 480, 1100 330 S 1700 480, 2100 350 L 2100 1000 L -400 1000 Z" fill="url(#wave-grad-1)" />
  </g>
  <g style="animation: waveFloatMid 34s ease-in-out infinite; transform-origin: 65% 45%;">
    <path d="M -300 520 C 300 340, 800 580, 1350 400 S 1800 460, 2100 430 L 2100 1000 L -300 1000 Z" fill="url(#wave-grad-2)" />
  </g>
  <g style="animation: waveFloatFront 44s ease-in-out infinite; transform-origin: 50% 50%;">
    <path d="M -300 0 C 400 260, 900 120, 1450 260 S 1800 0, 2100 -80 L 2100 -500 L -300 -500 Z" fill="url(#wave-grad-3)" />
  </g>

  <g filter="url(#macos-shadow)" style="animation: windowFloatY 8s ease-in-out infinite;">
    <rect x="390" y="105" width="820" height="390" rx="12" fill="url(#window-gradient)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
    
    <g>
      <clipPath id="titlebar-clip">
        <rect x="390" y="105" width="820" height="46" rx="12" />
      </clipPath>
      <rect x="390" y="105" width="820" height="46" fill="url(#titlebar-gradient)" clip-path="url(#titlebar-clip)" />
      <rect x="390" y="150" width="820" height="1" fill="#ffffff" fill-opacity="0.04" />
    </g>
    
    <g filter="url(#button-glow)">
      <circle cx="422" cy="128" r="8" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
      <circle cx="447" cy="128" r="8" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
      <circle cx="472" cy="128" r="8" fill="#27c93f" stroke="#1aaa2c" stroke-width="0.5"/>
    </g>
    <text x="800" y="134" class="title-text" text-anchor="middle">profile.txt</text>

    <g transform="translate(800, 270)">
      <text class="monospace-text" text-anchor="middle">Hello, I'm Zligh</text>
      <text class="monospace-text" text-anchor="middle" dy="64">
        currently my only skill is <tspan fill="#ff6a00" filter="url(#rust-glow)" font-weight="600">Rust</tspan><tspan class="blinking-cursor" fill="#ff6a00" filter="url(#rust-glow)" font-weight="600">|</tspan>
      </text>
    </g>
  </g>

  <g transform="translate(1175, 385)" filter="url(#cursor-shadow)" style="overflow: visible;">
    <g style="animation: cursorFloatX 7.2s ease-in-out infinite;">
      <g style="animation: cursorFloatY 5.1s ease-in-out infinite;">
        <path d="M 0,-35 L 0,35 M -6.3,0 L 6.3,0 M -16.8,-40.25 Q 0,-40.25 0,-27.3 M 16.8,-40.25 Q 0,-40.25 0,-27.3 M -16.8,40.25 Q 0,40.25 0,27.3 M 16.8,40.25 Q 0,40.25 0,27.3" 
              stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              
        <path d="M 0,-35 L 0,35 M -6.3,0 L 6.3,0 M -16.8,-40.25 Q 0,-40.25 0,-27.3 M 16.8,-40.25 Q 0,-40.25 0,-27.3 M -16.8,40.25 Q 0,40.25 0,27.3 M 16.8,40.25 Q 0,40.25 0,27.3" 
              stroke="#0b0b0d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
    </g>
  </g>
</svg>
