<svg fill="none" viewBox="0 0 600 50" width="600" height="50" xmlns="http://w3.org">
  <style>
    .brutal-text {
      font-family: 'Courier New', monospace;
      font-size: 24px;
      font-weight: bold;
      fill: #a370f7; /* Твій фірмовий фіолетовый */
      opacity: 0;
      animation: bootGlow 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes bootGlow {
      0% { transform: scale(0.9) translateY(10px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
  </style>
  <text x="10" y="35" class="brutal-text">> Just Use Rust. Brutal. _</text>
</svg>
