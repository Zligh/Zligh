<svg viewBox="0 0 260 45" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ff6a00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="258" height="43" rx="10" fill="url(#bgGrad)" stroke="url(#lineGrad)" stroke-width="1" filter="url(#shadow)"/>
  
  <circle cx="18" cy="22.5" r="3" fill="#ff6a00">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <text x="32" y="27" font-family="SFMono-Regular, ui-monospace, monospace" font-size="14" fill="#d0d0d5" letter-spacing="0.2px">VIEWS</text>

  <text id="viewCount" x="135" y="27" font-family="SFMono-Regular, ui-monospace, monospace" font-size="14" fill="#ff6a00" font-weight="bold" filter="url(#glow)">0</text>

  <script type="text/javascript">
    <![CDATA[
      (async function() {
        try {
          const response = await fetch('https://countapi.xyz/update/Zligh.Zligh/views/?amount=1');
          const data = await response.json();
          const count = data.value.toLocaleString();
          const element = document.getElementById('viewCount');
          if (element) {
            element.textContent = count;
          }
        } catch (error) {
          console.error('Failed to update view count:', error);
        }
      })();
    ]]>
  </script>
</svg>