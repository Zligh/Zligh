<svg viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root{
        --glass-top:#2a2d36;
        --glass-mid:#171a21;
        --glass-bottom:#0d0f14;
        --glass-stroke:rgba(255,255,255,0.14);
        --glass-inner:rgba(255,255,255,0.10);
        --topbar-0:#291843;
        --topbar-1:#3b2163;
        --topbar-2:#221338;
        --text:#f6f3ff;
        --text-soft:#d7cbff;
        --prompt:#d7c8ff;
        --accent:#b98dff;
        --accent-2:#7d4dff;
        --button-red:#ff5f57;
        --button-yellow:#ffbd2e;
        --button-green:#28c840;
      }
      .mono{font-family:"JetBrains Mono",Consolas,monospace;}
    </style>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c3039" stop-opacity="0.88"/>
      <stop offset="18%" stop-color="#1d2028" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0c0f14" stop-opacity="0.97"/>
    </linearGradient>

    <linearGradient id="topbarFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1846"/>
      <stop offset="50%" stop-color="#3a2163"/>
      <stop offset="100%" stop-color="#25153d"/>
    </linearGradient>

    <linearGradient id="windowEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="22%" stop-color="#ceb3ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="innerEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#cdaeff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="auroraStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="18%" stop-color="#e8d6ff" stop-opacity="0.40"/>
      <stop offset="42%" stop-color="#c38cff" stop-opacity="0.90"/>
      <stop offset="58%" stop-color="#9d66ff" stop-opacity="0.95"/>
      <stop offset="78%" stop-color="#d7b8ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="auroraBlob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#efdeff" stop-opacity="0.92"/>
      <stop offset="34%" stop-color="#c48cff" stop-opacity="0.50"/>
      <stop offset="68%" stop-color="#8f5cff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8f5cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lowerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#b98dff" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#b98dff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b98dff" stop-opacity="0"/>
    </radialGradient>

    <filter id="auroraBlur" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="windowShadow" x="-25%" y="-25%" width="150%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset dy="18" dx="0" result="off"/>
      <feColorMatrix in="off" type="matrix"
        values="0 0 0 0 0.04
                0 0 0 0 0.03
                0 0 0 0 0.08
                0 0 0 0.66 0" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="1 0 0 0 0.12
                0 1 0 0 0.08
                0 0 1 0 0.22
                0 0 0 1 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>

    <filter id="textGlow" x="-30%" y="-50%" width="170%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.22
                0 1 0 0 0.10
                0 0 1 0 0.28
                0 0 0 1 0" result="colored"/>
      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="terminalClip">
      <rect x="150" y="220" width="1236" height="560" rx="28"/>
    </clipPath>
  </defs>

  <!-- transparent background -->

  <!-- soft ambient outside terminal -->
  <g filter="url(#auroraBlur)" opacity="0.9">
    <path d="M 0 470 C 180 360, 380 610, 620 470 S 1030 305, 1536 500"
          fill="none" stroke="url(#auroraStroke)" stroke-width="58" stroke-linecap="round" opacity="0.55">
      <animate attributeName="d" dur="18s" repeatCount="indefinite"
               values="
               M 0 470 C 180 360, 380 610, 620 470 S 1030 305, 1536 500;
               M 0 430 C 230 530, 410 300, 670 445 S 1010 610, 1536 420;
               M 0 470 C 180 360, 380 610, 620 470 S 1030 305, 1536 500"/>
    </path>
    <path d="M 0 360 C 210 230, 420 390, 640 290 S 1110 165, 1536 290"
          fill="none" stroke="url(#auroraStroke)" stroke-width="40" stroke-linecap="round" opacity="0.36">
      <animate attributeName="d" dur="22s" repeatCount="indefinite"
               values="
               M 0 360 C 210 230, 420 390, 640 290 S 1110 165, 1536 290;
               M 0 290 C 240 170, 450 420, 700 300 S 1130 350, 1536 230;
               M 0 360 C 210 230, 420 390, 640 290 S 1110 165, 1536 290"/>
    </path>
    <path d="M 80 780 C 280 650, 520 890, 760 740 S 1230 565, 1456 760"
          fill="none" stroke="url(#auroraStroke)" stroke-width="38" stroke-linecap="round" opacity="0.32">
      <animate attributeName="d" dur="24s" repeatCount="indefinite"
               values="
               M 80 780 C 280 650, 520 890, 760 740 S 1230 565, 1456 760;
               M 80 730 C 250 900, 560 620, 820 800 S 1240 920, 1456 700;
               M 80 780 C 280 650, 520 890, 760 740 S 1230 565, 1456 760"/>
    </path>
  </g>

  <g filter="url(#auroraBlur)" opacity="0.95">
    <ellipse cx="210" cy="502" rx="250" ry="115" fill="url(#auroraBlob)" opacity="0.82"/>
    <ellipse cx="1315" cy="505" rx="260" ry="110" fill="url(#auroraBlob)" opacity="0.75"/>
    <ellipse cx="1220" cy="305" rx="220" ry="105" fill="url(#auroraBlob)" opacity="0.36"/>
    <ellipse cx="350" cy="310" rx="240" ry="95" fill="url(#auroraBlob)" opacity="0.22"/>
  </g>

  <ellipse cx="768" cy="794" rx="470" ry="94" fill="url(#lowerGlow)" filter="url(#bigBlur)" opacity="0.70"/>

  <!-- Terminal shadow -->
  <rect x="150" y="220" width="1236" height="560" rx="28" fill="#000000" opacity="0.30" filter="url(#windowShadow)"/>

  <!-- Terminal group -->
  <g clip-path="url(#terminalClip)">
    <!-- outer glass -->
    <rect x="150" y="220" width="1236" height="560" rx="28"
          fill="url(#glassFill)"
          stroke="url(#windowEdge)" stroke-width="1.75"/>

    <!-- subtle dark depth -->
    <rect x="150" y="220" width="1236" height="560" rx="28" fill="#07080d" opacity="0.10"/>

    <!-- upper-right refraction haze -->
    <ellipse cx="1260" cy="315" rx="250" ry="110" fill="#ffffff" opacity="0.075" filter="url(#bigBlur)"/>
    <ellipse cx="1220" cy="280" rx="165" ry="65" fill="#ffffff" opacity="0.060" filter="url(#bigBlur)"/>

    <!-- lower-left / lower-right light bleed -->
    <ellipse cx="320" cy="710" rx="320" ry="150" fill="#b98dff" opacity="0.09" filter="url(#bigBlur)"/>
    <ellipse cx="1215" cy="705" rx="310" ry="140" fill="#b98dff" opacity="0.08" filter="url(#bigBlur)"/>

    <!-- inner edge -->
    <rect x="159" y="229" width="1218" height="542" rx="22"
          fill="none" stroke="url(#innerEdge)" stroke-width="1.2"/>

    <!-- glass highlight lines -->
    <path d="M 175 250 C 485 232, 1010 234, 1382 250"
          fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.1"/>
    <path d="M 175 263 C 520 250, 980 252, 1382 270"
          fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.2"/>

    <!-- aurora glow inside glass -->
    <g filter="url(#auroraBlur)" opacity="0.95">
      <path d="M 70 620 C 275 500, 420 760, 680 635 S 1110 420, 1460 590"
            fill="none" stroke="url(#auroraStroke)" stroke-width="50" stroke-linecap="round" opacity="0.72">
        <animate attributeName="d" dur="14s" repeatCount="indefinite"
                 values="
                 M 70 620 C 275 500, 420 760, 680 635 S 1110 420, 1460 590;
                 M 70 580 C 260 700, 505 470, 765 610 S 1150 760, 1460 560;
                 M 70 620 C 275 500, 420 760, 680 635 S 1110 420, 1460 590"/>
      </path>
      <path d="M 95 690 C 320 610, 485 815, 725 700 S 1130 560, 1440 670"
            fill="none" stroke="url(#auroraStroke)" stroke-width="30" stroke-linecap="round" opacity="0.42">
        <animate attributeName="d" dur="18s" repeatCount="indefinite"
                 values="
                 M 95 690 C 320 610, 485 815, 725 700 S 1130 560, 1440 670;
                 M 95 650 C 290 790, 520 555, 760 705 S 1155 825, 1440 630;
                 M 95 690 C 320 610, 485 815, 725 700 S 1130 560, 1440 670"/>
      </path>
    </g>

    <!-- grain -->
    <rect x="150" y="220" width="1236" height="560" rx="28" filter="url(#noise)" opacity="0.16"/>

    <!-- titlebar -->
    <path d="M 178 220 H 1358 A 28 28 0 0 1 1386 248 V 278 H 150 V 248 A 28 28 0 0 1 178 220 Z"
          fill="#2d1849"/>
    <path d="M 178 221 H 1358 A 27 27 0 0 1 1385 248"
          fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.0"/>
    <path d="M 150 277 H 1386" fill="none" stroke="#140b1f" stroke-opacity="0.92" stroke-width="1.35"/>

    <!-- buttons -->
    <g>
      <circle cx="192" cy="249" r="13" fill="#ff5f57"/>
      <circle cx="192" cy="246" r="4.1" fill="#ffffff" opacity="0.22"/>
      <circle cx="192" cy="249" r="13" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>

      <circle cx="236" cy="249" r="13" fill="#ffbd2e"/>
      <circle cx="236" cy="246" r="4.1" fill="#ffffff" opacity="0.20"/>
      <circle cx="236" cy="249" r="13" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>

      <circle cx="280" cy="249" r="13" fill="#28c840"/>
      <circle cx="280" cy="246" r="4.1" fill="#ffffff" opacity="0.20"/>
      <circle cx="280" cy="249" r="13" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>
    </g>

    <!-- title -->
    <text x="768" y="255" text-anchor="middle" class="mono"
          font-size="27" fill="#e8ddff" opacity="0.84">
      zligh@rust:~
    </text>

    <!-- prompt -->
    <text x="195" y="365" class="mono" font-size="34" fill="#d9cbff" opacity="0.98">
      zligh@rust:$
    </text>

    
    <!-- main line -->
    <g class="mono" font-size="62" font-weight="500" fill="#f9f6ff" filter="url(#textGlow)">
      <text x="410" y="558">Just Use Rust.</text>

      <text x="900" y="558">
        Brutal
        <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
                 calcMode="discrete"
                 values="1;0;0;1"
                 keyTimes="0;0.33;0.66;1"/>
      </text>

      <text x="900" y="558" opacity="0">
        Brvtal
        <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
                 calcMode="discrete"
                 values="0;1;0;0"
                 keyTimes="0;0.33;0.66;1"/>
      </text>

      <text x="900" y="558" opacity="0">
        Brut4l
        <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
                 calcMode="discrete"
                 values="0;0;1;0"
                 keyTimes="0;0.33;0.66;1"/>
      </text>
    </g>

    <!-- cursor -->
    <path d="M 1185 503 V 565" stroke="#ffffff" stroke-width="8"
          stroke-linecap="round" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.08;0.55"
               dur="0.55s" repeatCount="indefinite"/>
    </path>
<!-- footer -->
    <text x="194" y="730" class="mono" font-size="24" fill="#bda7ff" opacity="0.60">
      Rust
    </text>

    <!-- subtle bottom border bloom -->
    <path d="M 170 774 C 480 804, 1030 804, 1370 774"
          fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.0"/>
  </g>

  <!-- outer faint vignette around terminal edges -->
  <rect x="150" y="220" width="1236" height="560" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.2"/>
</svg>
